# Nginx Rate Limiting and Static Asset Caching for Aurion
limit_req_zone $binary_remote_addr zone=aurion_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=aurion_static:10m rate=100r/s;

server {
    listen 80;
    server_name arelogic.space;

    # Production Healthcheck
    location /healthz {
        proxy_pass http://127.0.0.1:3000/healthz;
        access_log off;
    }

    # API Routes with rate limiting
    location /api/ {
        limit_req zone=aurion_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # External GLB models caching
    location /models/glb/ {
        limit_req zone=aurion_static burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # SPA Root
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
